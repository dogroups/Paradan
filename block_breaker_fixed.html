<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Block Breaker</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070b18;color:white;font-family:Arial,sans-serif}
body{display:flex;justify-content:center}
#app{width:min(100%,700px);height:100%;display:flex;flex-direction:column;padding:10px;box-sizing:border-box}
#bar{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 10px;font-weight:bold}
#bar span{background:#121a35;border:1px solid #27345f;border-radius:9px;padding:7px 9px;font-size:13px}
#game{width:100%;flex:1;min-height:0;background:#080d20;border:1px solid #27345f;border-radius:14px;touch-action:none}
#buttons{display:flex;gap:10px;padding-top:10px}
button{flex:1;height:52px;border:0;border-radius:13px;background:#26396f;color:#fff;font-size:18px;font-weight:bold}
#left,#right{font-size:25px}
#pause{flex:.7}
#screen{position:fixed;inset:0;background:rgba(3,6,15,.82);display:flex;align-items:center;justify-content:center}
.card{width:82%;max-width:360px;text-align:center;background:#10172e;border:1px solid #354579;border-radius:20px;padding:25px}
.card h1{margin:0 0 8px;font-size:32px}
.card p{color:#aeb8d5;line-height:1.5}
#play{background:#5c6cff}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
 <div id="bar">
  <strong>🧱 BLOCK BREAKER</strong>
  <span>Score <b id="score">0</b></span>
  <span>❤️ <b id="lives">3</b></span>
  <span>Lv <b id="level">1</b></span>
 </div>
 <canvas id="game"></canvas>
 <div id="buttons">
  <button id="left">◀</button><button id="pause">Ⅱ</button><button id="right">▶</button>
 </div>
</div>

<div id="screen">
 <div class="card">
  <h1 id="title">BLOCK BREAKER</h1>
  <p id="message">Break every brick. Keep the ball from falling!</p>
  <button id="play">▶ PLAY</button>
 </div>
</div>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),levelEl=document.getElementById("level");
const screen=document.getElementById("screen"),play=document.getElementById("play"),title=document.getElementById("title"),message=document.getElementById("message");
let W,H,scale=1,game=false,pause=false,last=0,score=0,lives=3,level=1,bricks=[];
let paddle={x:0,w:100,h:14,y:0},ball={x:0,y:0,r:8,vx:4,vy:-5},move=0,particles=[];

function size(){
 const r=c.getBoundingClientRect();scale=Math.min(devicePixelRatio||1,2);
 W=r.width;H=r.height;c.width=W*scale;c.height=H*scale;x.setTransform(scale,0,0,scale,0,0);
 paddle.y=H-28;paddle.w=Math.max(85,Math.min(115,W*.18));paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
}
function levelUp(){
 bricks=[];
 const cols=Math.max(5,Math.min(9,Math.floor(W/70))), rows=Math.min(6,2+level);
 const gap=6,bw=(W-20-gap*(cols-1))/cols,bh=22;
 for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)bricks.push({x:10+q*(bw+gap),y:25+r*(bh+gap),w:bw,h:bh,on:1});
}
function resetBall(){
 ball.x=W/2;ball.y=H-55;
 let s=4.8+level*.35,dir=Math.random()<.5?-1:1;
 ball.vx=dir*s*.7;ball.vy=-s;
}
function newGame(){
 score=0;lives=3;level=1;pause=false;particles=[];size();paddle.x=(W-paddle.w)/2;levelUp();resetBall();stats();
}
function stats(){scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level}
function start(){
 newGame();game=true;pause=false;screen.classList.add("hide");last=performance.now();requestAnimationFrame(loop);
}
play.onclick=start;

function setMove(v){move=v}
function bind(btn,v){
 ["touchstart","mousedown"].forEach(e=>btn.addEventListener(e,a=>{a.preventDefault();setMove(v)}));
 ["touchend","touchcancel","mouseup","mouseleave"].forEach(e=>btn.addEventListener(e,a=>{a.preventDefault();setMove(0)}));
}
bind(document.getElementById("left"),-1);bind(document.getElementById("right"),1);
document.getElementById("pause").onclick=()=>{if(game)pause=!pause};

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move=-1;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move=1;
 if(e.key===" "){if(game)pause=!pause}
});
window.addEventListener("keyup",e=>{if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))move=0});

function hitRect(b){
 let nx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),ny=Math.max(b.y,Math.min(ball.y,b.y+b.h));
 return (ball.x-nx)**2+(ball.y-ny)**2<ball.r**2;
}
function burst(px,py){
 for(let i=0;i<7;i++){let a=Math.random()*6.28,s=Math.random()*3+1;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:35})}
}
function update(dt){
 paddle.x+=move*8*dt*60;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
 ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;
 if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
 if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
 if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
 if(ball.vy>0&&hitRect(paddle)){
  ball.y=paddle.y-ball.r;
  let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2),s=Math.hypot(ball.vx,ball.vy);
  ball.vx=hit*s*.9;ball.vy=-Math.sqrt(Math.max(5,s*s-ball.vx*ball.vx));
 }
 for(let b of bricks)if(b.on&&hitRect(b)){
  b.on=0;score+=100;stats();burst(ball.x,ball.y);
  let px=ball.x-ball.vx*dt*60,py=ball.y-ball.vy*dt*60;
  if(px<b.x||px>b.x+b.w)ball.vx*=-1;else ball.vy*=-1;
  break;
 }
 if(bricks.every(b=>!b.on)){level++;score+=500;levelUp();resetBall();stats()}
 if(ball.y>H+ball.r){
  lives--;stats();
  if(lives<=0){
   game=false;title.textContent="GAME OVER";message.textContent="Your score: "+score;play.textContent="↻ PLAY AGAIN";screen.classList.remove("hide");
  }else resetBall();
 }
 particles=particles.filter(p=>p.l>0);
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l--});
}
function draw(){
 x.clearRect(0,0,W,H);
 x.fillStyle="#080d20";x.fillRect(0,0,W,H);
 x.strokeStyle="rgba(100,130,255,.05)";
 for(let a=0;a<W;a+=35){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}
 for(let a=0;a<H;a+=35){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}
 bricks.forEach((b,i)=>{
  if(!b.on)return;x.fillStyle=`hsl(${(i*25+level*30)%360},80%,58%)`;x.shadowBlur=10;x.shadowColor=x.fillStyle;
  x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,5);x.fill();x.shadowBlur=0;
 });
 x.fillStyle="#7080ff";x.beginPath();x.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);x.fill();
 x.fillStyle="#fff";x.shadowBlur=18;x.shadowColor="#fff";x.beginPath();x.arc(ball.x,ball.y,ball.r,0,6.28);x.fill();x.shadowBlur=0;
 particles.forEach(p=>{x.globalAlpha=p.l/35;x.fillStyle="#9da9ff";x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1;
}
function loop(t){
 if(!game)return;let dt=Math.min(.025,(t-last)/1000);last=t;
 if(!pause)update(dt);draw();requestAnimationFrame(loop);
}
window.addEventListener("resize",size);
size();newGame();draw();
</script>
</body>
</html>
