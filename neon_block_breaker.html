<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Block Breaker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(100vw,900px);height:100vh;display:flex;flex-direction:column;padding:10px}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 10px}
.title{font-size:clamp(18px,4vw,28px);font-weight:800;letter-spacing:1px}
.stats{display:flex;gap:10px;font-size:13px;font-weight:700}
.stat{padding:6px 9px;border:1px solid #263257;border-radius:10px;background:#0b1024}
canvas{display:block;width:100%;flex:1;min-height:0;border:1px solid #263257;border-radius:16px;background:radial-gradient(circle at 50% 20%,#101b45,#050816 65%);box-shadow:0 0 35px rgba(65,105,255,.15)}
#controls{display:flex;justify-content:center;gap:8px;padding-top:10px}
button{border:1px solid #354476;background:#101832;color:#fff;border-radius:11px;padding:9px 15px;font-weight:750;cursor:pointer}
button:active{transform:scale(.97)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,5,16,.72);backdrop-filter:blur(5px)}
.panel{width:min(88vw,390px);text-align:center;padding:28px;border:1px solid #334277;border-radius:20px;background:#0b1024;box-shadow:0 20px 80px #0008}
.panel h1{margin:0 0 8px;font-size:34px}
.panel p{color:#aeb8d8;margin:8px 0 20px}
#start{font-size:16px;padding:12px 24px;background:#5b6cff;border-color:#7180ff}
.hidden{display:none!important}
.hint{text-align:center;color:#7f8bb1;font-size:11px;padding:7px 0 2px}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div class="title">⚡ NEON BREAKER</div>
    <div class="stats">
      <div class="stat">SCORE <span id="score">0</span></div>
      <div class="stat">LIVES <span id="lives">3</span></div>
      <div class="stat">LEVEL <span id="level">1</span></div>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div id="controls">
    <button id="pause">⏸ Pause</button>
    <button id="restart">↻ Restart</button>
  </div>
  <div class="hint">Move with ← → / A D • Mouse or touch also works • Break every block!</div>
</div>

<div id="overlay">
  <div class="panel">
    <h1 id="ovTitle">NEON BREAKER</h1>
    <p id="ovText">Smash the blocks and survive every level.</p>
    <button id="start">▶ Start Game</button>
  </div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),startBtn=document.getElementById('start');
const pauseBtn=document.getElementById('pause'),restartBtn=document.getElementById('restart');

let W=800,H=600,dpr=1,running=false,paused=false,score=0,lives=3,level=1,raf=0,last=0;
let paddle={x:350,y:550,w:110,h:13,speed:8},ball={x:400,y:525,r:8,vx:4,vy:-5};
let bricks=[],particles=[],keys={};

function resize(){
  const r=canvas.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  paddle.y=H-38; paddle.x=Math.min(paddle.x,W-paddle.w);
}
window.addEventListener('resize',resize);

function makeLevel(){
  bricks=[]; const cols=Math.max(6,Math.min(10,Math.floor(W/75))), rows=Math.min(7,3+level);
  const gap=7, bw=(W-30-gap*(cols-1))/cols, bh=22;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    bricks.push({x:15+c*(bw+gap),y:38+r*(bh+gap),w:bw,h:bh,hp:level>3&&r<2?2:1});
  }
}
function resetBall(){
  ball.x=W/2;ball.y=H-62;ball.r=8;
  const speed=5+level*.45, dir=Math.random()<.5?-1:1;
  ball.vx=dir*speed*.7;ball.vy=-speed;
}
function resetGame(){
  score=0;lives=3;level=1;paused=false;running=false;particles=[];paddle.w=Math.max(85,Math.min(120,W*.14));
  paddle.x=(W-paddle.w)/2;makeLevel();resetBall();updateStats();
  ovTitle.textContent='NEON BREAKER';ovText.textContent='Smash the blocks and survive every level.';startBtn.textContent='▶ Start Game';overlay.classList.remove('hidden');
}
function updateStats(){scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level}

function burst(x,y,n=8){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*25});
  }
}
function rectHitCircle(b,o){
  const cx=Math.max(o.x,b.x),cy=Math.max(o.y,b.y);
  return (o.x-cx)**2+(o.y-cy)**2<o.r**2;
}
function movePaddleTo(clientX){
  const r=canvas.getBoundingClientRect();paddle.x=clientX-r.left-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
}
canvas.addEventListener('mousemove',e=>movePaddleTo(e.clientX));
canvas.addEventListener('touchmove',e=>{movePaddleTo(e.touches[0].clientX);e.preventDefault()},{passive:false});

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key===' '&&running) togglePause();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function togglePause(){
  if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶ Resume':'⏸ Pause';
}
pauseBtn.onclick=togglePause;
restartBtn.onclick=resetGame;
startBtn.onclick=()=>{overlay.classList.add('hidden');running=true;paused=false;pauseBtn.textContent='⏸ Pause';last=performance.now();requestAnimationFrame(loop)};

function update(dt){
  if(keys['arrowleft']||keys['a'])paddle.x-=paddle.speed*dt*60;
  if(keys['arrowright']||keys['d'])paddle.x+=paddle.speed*dt*60;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

  ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;
  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}

  if(ball.vy>0&&rectHitCircle(paddle,ball)){
    ball.y=paddle.y-ball.r;
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    const speed=Math.hypot(ball.vx,ball.vy);
    ball.vx=hit*speed*.95;ball.vy=-Math.sqrt(Math.max(4,speed*speed-ball.vx*ball.vx));burst(ball.x,ball.y,3);
  }

  for(const b of bricks)if(b.hp>0&&rectHitCircle(b,ball)){
    const px=ball.x-ball.vx*dt*60,py=ball.y-ball.vy*dt*60;
    if(px< b.x||px>b.x+b.w)ball.vx*=-1;else ball.vy*=-1;
    b.hp--;score+=b.hp===0?100:25;burst(ball.x,ball.y,7);updateStats();break;
  }

  if(bricks.every(b=>b.hp<=0)){
    level++;score+=500;makeLevel();resetBall();updateStats();burst(W/2,H/2,45);
  }

  if(ball.y-ball.r>H){
    lives--;updateStats();burst(ball.x,H-20,20);
    if(lives<=0){running=false;ovTitle.textContent='GAME OVER';ovText.textContent='Final score: '+score;startBtn.textContent='↻ Play Again';overlay.classList.remove('hidden')}
    else resetBall();
  }

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(100,130,255,.06)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  bricks.forEach((b,i)=>{
    if(b.hp<=0)return;
    const hue=(i*17+level*35)%360;
    ctx.shadowBlur=14;ctx.shadowColor=`hsl(${hue},90%,60%)`;
    ctx.fillStyle=`hsl(${hue},75%,52%)`;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,6);ctx.fill();
    ctx.shadowBlur=0;
    if(b.hp>1){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(b.x+8,b.y+7,b.w-16,3)}
  });
  ctx.shadowBlur=18;ctx.shadowColor='#6c7cff';ctx.fillStyle='#7180ff';ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();ctx.shadowBlur=0;

  ctx.shadowBlur=22;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/60);ctx.fillStyle='#9ba7ff';ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
}
function loop(t){
  if(!running)return;
  const dt=Math.min(.025,(t-last)/1000);last=t;
  if(!paused)update(dt);draw();raf=requestAnimationFrame(loop);
}
resize();resetGame();draw();
</script>
</body>
</html>
